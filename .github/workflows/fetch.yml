# GitHub 中转下载 Claude 官方离线安装包（含 Cowork 沙箱镜像）
# 用法：本文件由自动化脚本上传到临时私有仓库并触发，无需手动操作。
# 原理：Actions 构建机在美国，可直接访问 claude.ai 下载官方离线包；
#       因免费账号 Actions 产物存储仅 500MB，改为分卷(<2GB)上传到 Release 资产，
#       本地经 api.github.com（国内可直连）取回后合并。
# 安全：下载的是 Anthropic 官方原始文件；记录 SHA256；
#       Windows 安装脚本(修复沙箱.ps1)安装前还会强制 Authenticode 验签。
name: fetch-claude-offline

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU architecture: x64 or arm64"
        required: true
        default: "x64"
        type: choice
        options: [x64, arm64]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download official offline package
        env:
          ARCH: ${{ github.event.inputs.arch }}
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36"
          echo "Runner egress IP info:"
          curl -s --max-time 20 https://ipinfo.io/json || true
          echo
          URLS=(
            "https://claude.ai/api/desktop/win32/${ARCH}/msix/latest/redirect"
            "https://claude.ai/api/desktop/win32/${ARCH}/offline/latest/redirect"
            "https://claude.ai/api/desktop/win32/${ARCH}/setup/latest/redirect"
          )
          SUCCESS=0
          for URL in "${URLS[@]}"; do
            echo "== Trying: $URL"
            CODE=$(curl -sL -A "$UA" -H "Accept: */*" --retry 2 --retry-delay 5 \
              --max-time 1800 -D headers.txt -o claude-offline.msix -w "%{http_code}" "$URL")
            echo "HTTP $CODE"
            grep -iE "^(HTTP|location|x-claude-error|content-type|content-length|cf-ray)" headers.txt || true
            SIZE=$(stat -c%s claude-offline.msix 2>/dev/null || echo 0)
            echo "Downloaded bytes: $SIZE"
            MAGIC=$(head -c 2 claude-offline.msix 2>/dev/null || true)
            if [ "$CODE" = "200" ] && [ "$MAGIC" = "PK" ] && [ "$SIZE" -gt 100000000 ]; then
              echo "OK: valid package from $URL"
              SUCCESS=1
              break
            fi
            echo "-- response body preview:"
            head -c 300 claude-offline.msix || true
            echo
          done
          if [ "$SUCCESS" != "1" ]; then
            echo "ERROR: all candidate URLs failed"
            exit 1
          fi
          ls -lh claude-offline.msix
          sha256sum claude-offline.msix | tee claude-offline.msix.sha256

      - name: Split into parts under 2GB (Release asset limit)
        run: |
          set -euo pipefail
          split -b 1900M -d -a 2 claude-offline.msix claude-offline.msix.part-
          ls -lh claude-offline.msix.part-*

      - name: Publish parts as Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="offline-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            claude-offline.msix.part-* claude-offline.msix.sha256 \
            --title "Claude offline package ($TAG)" \
            --notes "Official Anthropic offline installer parts. Merge in filename order: copy /b claude-offline.msix.part-00+part-01+... claude-offline.msix ; verify with .sha256 ; installer enforces Authenticode signature."
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          gh release view "$TAG" --json assets --jq '.assets[].name'